# Free Render web service for Boniface API
# https://dashboard.render.com → New → Blueprint → this repo
#
# Note: Free tier sleeps after idle and has no persistent disk —
# SQLite resets on redeploy. Fine for demos; upgrade later for real data.

services:
  - type: web
    name: boniface-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATA_DIR
        value: /tmp/boniface-data
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

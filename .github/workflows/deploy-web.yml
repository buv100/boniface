# Deploy Boniface web app to https://boniface.expo.app
# On every push to main + once daily so friends always get updates.

name: Deploy Web

on:
  push:
    branches: [main]
  schedule:
  # Daily 05:00 UTC (~08:00 Israel)
    - cron: "0 5 * * *"

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write web version manifest
        run: node scripts/write-web-version.mjs

      - name: Export static web
        env:
          EXPO_PUBLIC_API_URL: https://boniface-api.onrender.com/api
        run: npx expo export --platform web

      - name: Deploy to Expo Hosting
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli deploy --export-dir dist --prod --non-interactive
